path: docs/architecture/adr.yaml
# Fixture ADR configuration for the golden-output test (tests/adr-golden-test.sh).
project_name: ADR Fixture

# Records stay on v0 for now.
contract: "adr/v1"  # decided in review

domains:
  system:
    range: [100, 199]
    name: System
    description: Runtime, hooks and storage
    folder: system

  ops:
    range: [200, 299]
    name: Operations
    description: Deployment and runbooks, split across two folders
    folder:
      - operations
      - runbooks

  docs:
    range: [300, 399]
    name: Documentation
    description: Documentation structure and tooling
    folder: documentation

statuses:
  - Draft
  - Proposed
  - Accepted
  - Superseded
  - Deprecated
  - Rejected

defaults:
  deciders:
    - developer
    - agent
  status: Draft

legacy:
  range: [1, 99]
  label: "Legacy (Pre-Domain Numbering)"

viewer: cat {file}

kinds:
  decision:
    verb: required
    requires: [capability, basis, agent]
    sections: [Summary]
    edges: { supersedes: decision, amends: decision, extends: decision, basis: [decision, spec, evidence] }
  spec:
    verb: forbidden
    requires: [capability]
    edges: { supersedes: spec, decided_by: decision }
  evidence:
    verb: forbidden
    requires: [capability]
    edges: { supersedes: evidence }

# What the project does, one line each. A record's `capability` names one of
# these, and a decision adds, cuts, changes or constrains them. Replace the
# placeholder with the project's own list.
capabilities:
  core: The project's core behaviour (placeholder; replace)
