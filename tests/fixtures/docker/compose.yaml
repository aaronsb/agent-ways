# Live integration fixture (ADR-186). Entry point: `make test-live TIER=1`.
#
# Variables (all optional):
#   FLAVOR            branch (default): install the mounted checkout with the
#                     binaries under WAYS_BINARIES. release: run the one-liner.
#   CLAUDE_VERSION    Claude Code version baked into the image. test-live.sh
#                     sets it (its pin, or the caller's value); it is required
#                     here so the pin lives in one place.
#   CLAUDE_INSTALLER  native or npm; test-live.sh sets it
#   WAYS_BINARIES     host dir holding ways, ways-audit, attend, attend-chat
#                     (an empty scratch dir in the release flavor)
#   GH_TOKEN          for the release-asset downloads through gh
#   ANTHROPIC_API_KEY tier 2 only; test-live.sh reads it from the environment
#                     or from ANTHROPIC_API_KEY_FILE and never prints it
#   TIER2_MODEL, TIER2_SCENARIOS, TIER2_MAX_TURNS   tier 2 knobs (run-tier2.sh)
#   TIER2_OUT         host dir for tier 2 transcripts; test-live.sh makes one
services:
  tier1:
    build:
      context: .
      args:
        CLAUDE_VERSION: ${CLAUDE_VERSION:?set by test-live.sh}
        CLAUDE_INSTALLER: ${CLAUDE_INSTALLER:?set by test-live.sh}
    image: agent-ways-fixture:tier1-${CLAUDE_INSTALLER}-${CLAUDE_VERSION}
    environment:
      FLAVOR: ${FLAVOR:-branch}
      CLAUDE_VERSION: ${CLAUDE_VERSION}
      GH_TOKEN: ${GH_TOKEN:-}
    volumes:
      - ../../..:/src:ro
      - ${WAYS_BINARIES:?set by test-live.sh}:/binaries:ro
      - .:/fixture:ro
    command: bash /fixture/run-tier1.sh

  # Tier 2 reuses the tier 1 image and runs tier 1 first as its precondition.
  # The key reaches the container through the environment only: it is not a
  # build arg, so no image layer carries it.
  tier2:
    image: agent-ways-fixture:tier1-${CLAUDE_INSTALLER}-${CLAUDE_VERSION}
    build:
      context: .
      args:
        CLAUDE_VERSION: ${CLAUDE_VERSION:?set by test-live.sh}
        CLAUDE_INSTALLER: ${CLAUDE_INSTALLER:?set by test-live.sh}
    environment:
      FLAVOR: ${FLAVOR:-branch}
      CLAUDE_VERSION: ${CLAUDE_VERSION}
      GH_TOKEN: ${GH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?tier 2 needs a key}
      TIER2_MODEL: ${TIER2_MODEL:-}
      TIER2_SCENARIOS: ${TIER2_SCENARIOS:-}
      TIER2_MAX_TURNS: ${TIER2_MAX_TURNS:-}
    volumes:
      - ../../..:/src:ro
      - ${WAYS_BINARIES:?set by test-live.sh}:/binaries:ro
      - .:/fixture:ro
      - ${TIER2_OUT:?set by test-live.sh}:/out
    command: bash /fixture/run-tier2.sh
