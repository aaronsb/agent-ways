# Way frontmatter schema — single source of truth
# Read by: ways lint, ways-tests skill, authoring way
#
# Fields are categorized by role and marked required/recommended/optional.
# "required" means the linter flags its absence as an error.
# "recommended" means every way should have it, but the system has a sensible
#   default. Linter flags absence as a warning (with --strict).
# "optional" means absence is correct and never flagged.
# "conditional" means required only when a paired field is present.
#
# ── Functional firing contract (ground truth from the fire-time code) ──
# A way is *functionally active* only if it has at least one live firing path.
# The fire-time parser (scan/candidates.rs → WayCandidate, via get_fm_field) is
# a FLAT top-level `key: value` reader plus one bespoke `when:` block handler —
# nested YAML is invisible to it. The live paths and who consumes them:
#
#   semantic  description AND vocabulary (both non-empty)  → corpus embed → late-interaction
#   keyword   pattern (+ pattern_strict)                   → scan regex lane
#   bash      commands                                     → scan bash surface
#   file      files                                        → scan Edit/Write surface
#   state     trigger: session-start|context-threshold|file-exists (flat)  → scan/state.rs
#             (context-threshold also needs threshold; file-exists needs path)
#   attend    trigger: { type: attend, signals: [...] } (NESTED)           → attend binary
#             (read by extract_attend_signals, NOT by scan — flat parser sees trigger: as empty)
#
# Note the top-level `trigger:` key is dual-shaped: a flat string routes to the
# state lane; a nested `type/signals` map routes to the attend lane. They are
# documented below under `state:` and `attend:` respectively.
#
# Fields that are NOT firing paths — modifiers consumed by other subsystems:
#   scope, when.*   preconditions/gates (scan)
#   refire          re-fire cadence (ADR-126 marker subsystem, not candidate parsing)
#   macro           runs macro.sh (shell hook), not read by the Rust fire path
#   requires        ADR-116 permission audit only (ways lint / permissions), not fire-time
#   pattern_keep    pattern-hygiene lint directive only (ADR-155 §5), not fire-time
#   scan_exclude    macro.sh scan filter only, not read by the Rust fire path

way:
  trigger:
    description:
      type: string
      required: conditional  # required if vocabulary present
      role: Semantic matching reference text
    vocabulary:
      type: string
      required: conditional  # required if description present
      role: Space-separated domain keywords reinforcing the description (embedded as part of the canonical way alias per ADR-125)
    refire:
      type: scalar
      required: recommended
      role: |
        ADR-126 refire specification. Half-life as a fraction of the session
        context window, resolved against model_to_window() at fire time so
        way files stay portable across agent frameworks and model
        generations. Accepts either a numeric fraction (e.g., 0.2) to pin
        the cadence to today's model, or a preset name (once, rare, normal,
        frequent, or any custom name defined in config.refire_presets) that
        tracks the project's current tuning. Fire-bearing ways should carry
        this field; absence triggers a lint warning.

        The legacy `curve:` block (ADR-123) is no longer recognized by the
        schema — lint flags it as unknown/foreign, and existing ways were
        migrated to `refire:` in PR #71. Non-Exponential shapes (Flat,
        ActionPotential, ProgressiveStaircase) are not currently in use and
        would need schema re-addition to author again.
    pattern:
      type: regex
      required: optional
      role: Supplementary regex trigger — use alongside semantic, not instead of
    pattern_strict:
      type: boolean
      required: optional
      role: >
        Opt out of the semantic keyword gate AND the URL/code-fence mask
        (ADR-155). A strict pattern fires on exactly what the user typed,
        always — reserve it for exact tokens (slash-command names, patterns
        that deliberately target URLs). Do not combine with common-word
        alternations; that reintroduces the noise the gate exists to veto.
    pattern_keep:
      type: string
      required: optional
      role: >
        Whitespace-separated bare words in pattern: that the pattern-hygiene
        lint should NOT flag as common/short (ADR-155 §5). Each is a measured,
        calibration-backed exception (ADR-156): the keyword is load-bearing and
        its off-sense noise scores below the keyword floor τ_k, so the heuristic
        flag is a known false alarm. Annotate with an inline `# reason` comment.
        Only silences the common-word and short-token rules — never the
        unbounded `.*` rule, which is a structural defect, not a judgement call.
    files:
      type: regex
      required: optional
      role: Regex matched against file paths (Edit/Write hooks)
    commands:
      type: regex
      required: optional
      role: Regex matched against bash commands

  preconditions:
    scope:
      type: enum
      values: [agent, subagent, teammate]
      required: recommended
      default: agent
      role: Who receives this way (comma-separated)
    when:
      type: block
      required: optional
      role: Deterministic gate checked before any matching
      subfields:
        project:
          type: path
          required: optional
          role: Only fire in this project directory

  # The attend lane is the NESTED shape of the top-level `trigger:` key:
  #   trigger:
  #     type: attend
  #     signals: [context-pressure, build-complete]
  # Read by extract_attend_signals (show/helpers.rs) and dispatched by the
  # attend binary — invisible to the scan fire path (its flat parser reads
  # `trigger:` as empty here). Not a scan/state trigger.
  attend:
    type:
      type: enum
      values: [attend]
      required: optional
      role: Under `trigger:`, marks this way as an attend signal handler (ADR-114)
    signals:
      type: array
      required: conditional  # required when type is attend
      role: Signal types this way handles (e.g. context-pressure, build-complete)

  state:
    trigger:
      type: enum
      values: [context-threshold, file-exists, session-start]
      required: optional
      role: >
        Flat state-trigger value (the top-level `trigger:` key as a string,
        instead of pattern/semantic). Routes to scan/state.rs. The nested
        `trigger: { type: attend, … }` form is the *attend* lane, not this.
    threshold:
      type: number
      required: conditional  # required when trigger is context-threshold
      role: Percentage (0-100) of context-window fill that fires the way. Only read for trigger, context-threshold.
    path:
      type: glob
      required: optional
      role: For file-exists trigger, glob relative to project

  display:
    macro:
      type: enum
      values: [prepend, append]
      required: optional
      role: Run macro.sh alongside way content

  permissions:
    requires:
      type: array
      required: optional
      role: Tool permissions this way needs (e.g. Bash(gh:*), Read). Audited against settings.json.

  extended:
    scan_exclude:
      type: regex
      required: optional
      role: File patterns for macros to skip (macro-specific)

  # provenance: moved to provenance.yaml sidecar (ADR-110)
  # Presence of provenance: in frontmatter is flagged as UNKNOWN by the linter.
  # See provenance_sidecar section below for the sidecar schema.

check:
  trigger:
    description:
      type: string
      required: conditional
    vocabulary:
      type: string
      required: conditional
    threshold:
      type: number
      required: optional
      default: 2.0
    files:
      type: regex
      required: optional
    commands:
      type: regex
      required: optional

  preconditions:
    scope:
      type: enum
      values: [agent, subagent, teammate]
      required: optional
      default: agent
    when:
      type: block
      required: optional
      role: Deterministic gate checked before any matching
      subfields:
        project:
          type: path
          required: optional
          role: Only fire in this project directory
        file_exists:
          type: path
          required: optional
          role: Only fire when this file exists in the project

# Locale stub schema — one JSON object per line in *.locales.jsonl files.
# These are the per-language overrides for description/vocabulary used by
# the multilingual corpus. Lint validates them against this key set.
locale_stub:
  lang:
    type: string
    required: true
    role: ISO 639-1 language code (e.g. "en", "de", "ja")
  description:
    type: string
    required: true
    role: Language-specific description for semantic matching
  vocabulary:
    type: string
    required: true
    role: Space-separated domain keywords in the target language (carries the "objective match words" of the way intent — ADR-125)

# Lint configuration
# Path segments that indicate backup/sync tool artifacts — not real ways.
# The linter skips any file whose path contains one of these segments.
lint:
  excluded_path_segments:
    - logseq/
    - /bak/
    - /.backup/
    - /backup/
    - /.obsidian/
    - /.sync/
    - /.trash/
    - /node_modules/
    - /.git/

# Provenance sidecar schema (ADR-110)
# Lives in provenance.yaml alongside the way file, not in frontmatter.
# Consumed by the `ways-audit` binary (report, trace, matrix, lint, …).
provenance_sidecar:
  policy:
    type: array
    required: optional
    role: Policy document URIs that this way implements
    items:
      uri:
        type: string
        required: true
      type:
        type: string
        required: optional
  controls:
    type: array
    required: optional
    role: Regulatory or standards controls addressed by this way
    items:
      id:
        type: string
        required: true
      justifications:
        type: array
        required: optional
  verified:
    type: date
    required: optional
    role: Last date provenance was reviewed for accuracy
  rationale:
    type: string
    required: optional
    role: Brief explanation of why these controls apply
