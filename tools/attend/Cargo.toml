[package]
name = "attend"
version = "0.15.2"
edition = "2021"
description = "Active awareness module — adaptive sensing and disclosure for Claude Code sessions"
license = "AGPL-3.0-or-later"

[[bin]]
name = "attend"
path = "src/main.rs"

[features]
default = ["sensor-peers", "sensor-processes", "sensor-keepwarm"]
sensor-peers = ["dep:sensor-peers"]
sensor-processes = ["dep:sensor-processes"]
sensor-keepwarm = ["dep:sensor-keepwarm"]

[dependencies]
agent-fmt = { path = "../agent-fmt" }
agent-identity = { path = "../agent-identity" }
agent-theme = { path = "../agent-theme" }
# attend's settings: the schema, the typed config and the writer (ADR-503).
agent-settings = { path = "../agent-settings" }
attend-config = { path = "../attend-config" }
serde_yaml = "0.9"
attend-groups = { path = "../attend-groups" }
attend-presence = { path = "../attend-presence" }
attend-instances = { path = "../attend-instances" }
claude-sessions = { path = "../claude-sessions" }
attend-state = { path = "../attend-state" }
sensor-trait = { path = "../sensor-trait" }
# CLI parsing — matches ADR-111's choice for `ways-cli`. Doc comments on
# the `Cli`/`Commands` types in `cli.rs` are the single source of truth
# for runtime help and the markdown reference (see `bin/gen-docs.rs`).
clap = { version = "4", features = ["derive"] }
clap-markdown = "0.1"
sensor-peers = { path = "../sensor-peers", optional = true }
sensor-processes = { path = "../sensor-processes", optional = true }
sensor-keepwarm = { path = "../sensor-keepwarm", optional = true }

[dev-dependencies]
# The message-lifecycle test consults `/purge`'s live-consumer seen-sets.
attend-chat = { path = "../attend-chat" }
