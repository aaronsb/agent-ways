[package]
name = "ways"
version = "1.32.0"
edition = "2021"
description = "Unified CLI for ways — knowledge guidance for Claude Code"
license = "AGPL-3.0-or-later"

[[bin]]
name = "ways"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = { version = "1", features = ["preserve_order"] }
walkdir = "2"
anyhow = "1"
glob = "0.3"
regex = "1"
rust-stemmers = "1.2"
agent-fmt = { path = "../agent-fmt" }
agent-identity = { path = "../agent-identity" }
agent-theme = { path = "../agent-theme" }
sensor-trait = { path = "../sensor-trait" }
ways-core = { path = "../ways-core" }
claude-sessions = { path = "../claude-sessions" }
# Profiles and key locations only; the provider HTTP clients stay in ways-agent.
ways-agent-core = { path = "../ways-agent-core" }
agent-settings = { path = "../agent-settings" }
# attend's settings schema, composed into `ways settings` (ADR-503 §1); the
# schema crate, never the attend binary.
attend-config = { path = "../attend-config" }
# The settings screens (ADR-504 §8) and the introspect screens (§9). Linked
# into `ways`, never called on a hook path (§11).
agent-tui = { path = "../agent-tui" }

[target.'cfg(windows)'.dependencies]
# Process liveness for `ways projects relocate` (OpenProcess + GetExitCodeProcess).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
# SIGPIPE back to its default, so a closed pipe ends the process quietly.
# The tests also use it for a pty that signals the settings screens mid-apply.
libc = "0.2"
