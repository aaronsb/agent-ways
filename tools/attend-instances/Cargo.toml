[package]
name = "attend-instances"
version = "0.1.0"
edition = "2021"
description = "Per-cwd session instance registry for attend (ADR-129)"
license = "AGPL-3.0-or-later"

[lib]
name = "attend_instances"
path = "src/lib.rs"

[dependencies]
# The settings crates' lock, atomic writer and clock (#727).
agent-fmt = { path = "../agent-fmt" }
agent-settings = { path = "../agent-settings" }
agent-identity = { path = "../agent-identity" }
agent-theme = { path = "../agent-theme" }
attend-presence = { path = "../attend-presence" }
claude-sessions = { path = "../claude-sessions" }
