[package]
name = "agent-tui"
version = "0.1.0"
edition = "2021"
description = "App shell on ratatui for agent-ways terminal applications"
license = "AGPL-3.0-or-later"

[lib]
name = "agent_tui"
path = "src/lib.rs"

# The shell knows nothing about ways or attend (ADR-504 §3): colour comes
# from agent-theme, and an adapter supplies the content, the writes and the
# commands.
[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
agent-theme = { path = "../agent-theme", features = ["ratatui"] }
# The termination signals the run loop restores the terminal on.
signal-hook = "0.3"
# Markdown to styled text (`markdown`).
pulldown-cmark = { version = "0.13", default-features = false }
# Display widths for wrapping text and the input's rows.
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
# killpg, for the process group of a command in flight, and tcgetattr, to
# see a terminal that hung up.
libc = "0.2"
