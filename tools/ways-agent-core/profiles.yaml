# Engine profiles the ways agent ships (ADR-196 §5).
#
# The profiles are tuned on Claude Haiku 4.5 (ADR-195): the judge reads the
# way's path and description against the last turn, capped at 1,200
# characters, with a threshold of 0.3 on P(yes). Haiku 4.5 stays the shipped
# judge. Haiku 5.5 was measured on 2026-10-08 (332 golden groups, via
# OpenRouter; experiments/content-corpus/results-judge-haiku-5-5.md) and not
# adopted: its ranking is worse (AUC down 0.02 to 0.04, interval excludes 0),
# at 0.3 it passes more than twice the irrelevant candidates, and its p95 latency
# is over 3 s. It remains selectable per profile.
# Thresholds are per engine because each model's confidence sits on its own
# scale. A judge call takes about 0.6 s plus 0.1 s per candidate (ADR-195,
# second addendum), so a request carries at most a capped number, in the
# matcher's order, and keeps under the deadline. Every lane sends one
# request per scan; a candidate past the cap gets no verdict.
#
# A tool lane (command, file, tool, task, post-tool) sends at most
# tool_candidates, within tool_timeout_ms. Under the claude-code engine a
# request took about 515 ms plus 112 ms per candidate over a week of
# records. 16 candidates take about 2,300 ms, which leaves about 700 ms of
# the 3,000 ms deadline for a slow call. 22 would take about 2,980 ms, the
# average alone filling the deadline, so a scan near that cap would time out
# about half the time (#1372).
#
# The prompt and state lanes send at most max_candidates, within timeout_ms,
# and a candidate past it passes unjudged. From 2026-11-21 to 2026-11-27, 97.7%
# of 487 judged prompt-lane scans had 14 candidates or fewer (p50 1, p90 5,
# p99 20), and no state-lane scan of 700 had more than 4. 14 candidates take
# about 2,080 ms, which leaves about 700 ms of the 2,800 ms deadline for a
# slow call; 99% of 2,138 prompt- and state-lane calls ran no more than
# 520 ms over their average (#1378).
#
# `claude-code` judges inside Claude Code, through a ways mod module on the
# session's own account (ADR-708). It holds no key and keeps the others'
# settings until measured. Its model is pinned to Haiku 4.5, the key engines'
# model: under Claude Code the `haiku` alias resolves to Haiku 5.5, which
# thinks; in the spike its median was 1,938 ms and 23 of 50 calls ran past
# 2,000 ms, against 1,162 ms and 2 of 20 for Haiku 4.5. An unset engine never
# picks it: it is chosen only by name.
#
# A profile judges for two purposes, and each names its own model. Disclosure
# is the relevance judge above, and the profile's top-level fields set it.
# Continuance decides at a work boundary whether a session stops, compacts or
# continues, and `judgements.continuance` sets it. Setting one
# never changes the other. Continuance runs on Claude Haiku 5.5: a boundary
# waits on one call, so its thinking time costs little, and its deadline and
# output budget leave room for that thinking. `gate.mode` governs disclosure
# only.
#
# The user layer, $XDG_CONFIG_HOME/agent-ways/agent.yaml, overrides any field
# of any profile and survives updates. `ways settings set gate.…` writes it.

anthropic:
  display_name: Anthropic API key
  provider: anthropic
  model: claude-haiku-4-5
  threshold: 0.3
  timeout_ms: 2800
  turns: 1
  max_turn_chars: 1200
  concurrency: 8
  max_candidates: 14
  tool_timeout_ms: 3000
  tool_candidates: 16
  judgements:
    continuance:
      model: claude-haiku-5-5
      timeout_ms: 30000
      max_tokens: 4096

openrouter:
  display_name: OpenRouter API key
  provider: openrouter
  model: anthropic/claude-haiku-4.5
  threshold: 0.3
  timeout_ms: 2800
  turns: 1
  max_turn_chars: 1200
  concurrency: 8
  max_candidates: 14
  tool_timeout_ms: 3000
  tool_candidates: 16
  judgements:
    continuance:
      model: anthropic/claude-haiku-5.5
      timeout_ms: 30000
      max_tokens: 4096

claude-code:
  display_name: Claude Code internal
  provider: claude-code
  model: claude-haiku-4-5
  threshold: 0.3
  timeout_ms: 2800
  turns: 1
  max_turn_chars: 1200
  concurrency: 8
  max_candidates: 14
  tool_timeout_ms: 3000
  tool_candidates: 16
  judgements:
    continuance:
      model: claude-haiku-5-5
      timeout_ms: 30000
      max_tokens: 4096
