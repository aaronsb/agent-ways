# Engine profiles the ways agent ships (ADR-196 §5).
#
# The profiles were measured on Claude Haiku 4.5 (ADR-195): the judge reads
# the way's path and description against the last turn, capped at 1,200
# characters, with a threshold of 0.3 on P(yes). They moved to Claude Haiku
# 5.5 on 2026-10-08; 0.3 is carried over pending a re-measure on 5.5.
# Thresholds are per engine because each model's confidence sits on its own
# scale. A judge call takes about 0.6 s plus 0.1 s per candidate (ADR-195,
# second addendum), so a request carries at most max_candidates, in the
# matcher's order, and keeps under the deadline.
#
# The user layer, $XDG_CONFIG_HOME/agent-ways/agent.yaml, overrides any field
# of any profile and survives updates. `ways settings set gate.…` writes it.

anthropic:
  provider: anthropic
  model: claude-haiku-5-5
  threshold: 0.3
  timeout_ms: 2000
  turns: 1
  max_turn_chars: 1200
  concurrency: 8
  max_candidates: 8

openrouter:
  provider: openrouter
  model: anthropic/claude-haiku-5.5
  threshold: 0.3
  timeout_ms: 2000
  turns: 1
  max_turn_chars: 1200
  concurrency: 8
  max_candidates: 8
