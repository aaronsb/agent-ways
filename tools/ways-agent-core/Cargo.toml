[package]
name = "ways-agent-core"
version = "0.1.0"
edition = "2021"
description = "What the ways agent and its clients share: engine profiles and the key store (ADR-196, ADR-502). No network code, so the hook links no TLS."
license = "AGPL-3.0-or-later"

[dependencies]
agent-fmt = { path = "../agent-fmt" }
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ways-core = { path = "../ways-core" }
agent-settings = { path = "../agent-settings" }
