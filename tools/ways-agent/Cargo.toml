[package]
name = "ways-agent"
version = "0.2.0"
edition = "2021"
description = "The ways agent: one resident daemon per user that judges way relevance and holds the provider key (ADR-196, ADR-502)"
license = "AGPL-3.0-or-later"

[[bin]]
name = "ways-agent"
path = "src/main.rs"

[dependencies]
agent-fmt = { path = "../agent-fmt" }
agent-settings = { path = "../agent-settings" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ways-agent-core = { path = "../ways-agent-core" }
ways-core = { path = "../ways-core" }
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
serde_yaml = "0.9"
