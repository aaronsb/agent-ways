[workspace]
members = [
    "agent-fmt",
    "agent-identity",
    "sensor-trait",
    "ways-core",
    "ways-audit",
    "sensor-peers",
    "sensor-processes",
    "sensor-keepwarm",
    "ways-cli",
    "ways-mcp",
    "ways-agent-core",
    "ways-agent",
    "attend",
    "attend-chat",
    "attend-groups",
    "attend-instances",
    "attend-presence",
    "attend-state",
    "agent-theme",
    "agent-settings",
    "agent-tui",
    "claude-sessions",
    "attend-config",
    "tui-harness",
]
resolver = "2"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
