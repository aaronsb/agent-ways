[package]
name = "ways-core"
version = "1.0.0"
edition = "2021"
description = "Shared engine for the ways toolchain — discovery, frontmatter, paths, config"
license = "AGPL-3.0-or-later"

[lib]
name = "ways_core"
path = "src/lib.rs"

[dependencies]
agent-fmt = { path = "../agent-fmt" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = { version = "1", features = ["preserve_order"] }
walkdir = "2"
# Block-level markdown classification and the reflow post-condition (#415).
# Default features off: we need the parser, not the HTML renderer.
pulldown-cmark = { version = "0.13", default-features = false }
anyhow = "1"
# Event-log archives are gzip (ADR-701 §2). The pure-Rust backend (miniz_oxide,
# already in the workspace lock); licence MIT OR Apache-2.0.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sensor-trait = { path = "../sensor-trait" }
claude-sessions = { path = "../claude-sessions" }
agent-settings = { path = "../agent-settings" }
# The `theme` section's declarations, shared with attend (ADR-503).
agent-theme = { path = "../agent-theme", features = ["settings"] }
