[package]
name = "attend-chat"
version = "0.21.1"
edition = "2021"
description = "Interactive chat TUI for attend — human seat at the signal bus (ADR-120)"
license = "AGPL-3.0-or-later"

[lib]
name = "attend_chat"
path = "src/lib.rs"

[[bin]]
name = "attend-chat"
path = "src/main.rs"

[dependencies]
notify = "6"
agent-fmt = { path = "../agent-fmt" }
agent-identity = { path = "../agent-identity" }
# The screen's engine and look (ADR-504 §1, §3): terminal handling and
# signals, the shared widgets, and the test kit.
agent-tui = { path = "../agent-tui" }
agent-theme = { path = "../agent-theme", features = ["ratatui"] }
# Reads the user's theme choice (`theme.active`, `theme.shape`), read only.
attend-config = { path = "../attend-config" }
# The chat's own keys (`attend.chat.*`) resolve and are written through it.
agent-settings = { path = "../agent-settings" }
# The attend mod's keys (`attend_mod.listening`, `attend_mod.keepwarm`) are
# ways keys: their schema, layers and project root, which the Settings menu
# reads and writes as `ways settings set` does.
ways-core = { path = "../ways-core" }
serde_yaml = "0.9"
# The attend CLI's `--json` reports, for the cleanup items it runs.
serde_json = "1"
attend-groups = { path = "../attend-groups" }
# The add and the invitation, as every surface makes them (ADR-404 D1).
attend-membership = { path = "../attend-membership" }
attend-presence = { path = "../attend-presence" }
attend-instances = { path = "../attend-instances" }
attend-state = { path = "../attend-state" }
claude-sessions = { path = "../claude-sessions" }

[target.'cfg(unix)'.dev-dependencies]
# openpty and kill, for the lifecycle test of the binary on a terminal.
libc = "0.2"
