[package]
name = "attend-chat"
version = "0.7.1"
edition = "2021"
description = "Interactive chat TUI for attend — human seat at the signal bus (ADR-120)"
license = "AGPL-3.0-or-later"

[lib]
name = "attend_chat"
path = "src/lib.rs"

[[bin]]
name = "attend-chat"
path = "src/main.rs"

[dependencies]
notify = "6"
agent-fmt = { path = "../agent-fmt" }
agent-identity = { path = "../agent-identity" }
# The screen's engine and look (ADR-504 §1, §3): terminal handling and
# signals, the shared widgets, and the test kit.
agent-tui = { path = "../agent-tui" }
agent-theme = { path = "../agent-theme", features = ["ratatui"] }
# Reads the user's theme choice (`theme.active`, `theme.shape`), read only.
attend-config = { path = "../attend-config" }
attend-groups = { path = "../attend-groups" }
attend-presence = { path = "../attend-presence" }
attend-instances = { path = "../attend-instances" }
attend-state = { path = "../attend-state" }
claude-sessions = { path = "../claude-sessions" }

[target.'cfg(unix)'.dev-dependencies]
# openpty and kill, for the lifecycle test of the binary on a terminal.
libc = "0.2"
