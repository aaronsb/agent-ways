[package]
name = "attend-chat"
version = "0.6.2"
edition = "2021"
description = "Interactive chat TUI for attend — human seat at the signal bus (ADR-120)"
license = "AGPL-3.0-or-later"

[lib]
name = "attend_chat"
path = "src/lib.rs"

[[bin]]
name = "attend-chat"
path = "src/main.rs"

[dependencies]
iocraft = "0.8"
notify = "6"
async-channel = "2"
smol = "2"
agent-fmt = { path = "../agent-fmt" }
agent-identity = { path = "../agent-identity" }
agent-theme = { path = "../agent-theme" }
attend-groups = { path = "../attend-groups" }
attend-heartbeat = { path = "../attend-heartbeat" }
attend-identity-view = { path = "../attend-identity-view" }
attend-state = { path = "../attend-state" }
attend-instances = { path = "../attend-instances" }
attend-session = { path = "../attend-session" }
claude-sessions = { path = "../claude-sessions" }
