[package]
name = "command-describer"
version = "0.1.0"
edition = "2021"
description = "Parses a shell command string into ordered segments with role, program, subcommand, flags and class (ADR-188)"
license = "AGPL-3.0-or-later"

[lib]
name = "command_describer"
path = "src/lib.rs"

