# The agent-ways manual, published to GitHub Pages by .github/workflows/pages.yml.
# Pages come from docs/; the ways section is generated from hooks/ways/ at build
# time by scripts/docs-site/gen_ways.py, and the nav comes from
# scripts/docs-site/nav.md. Local preview: make site-serve.
site_name: agent-ways
site_description: Contextual ways of working for Claude Code, disclosed by hooks
site_url: https://aaronsb.github.io/agent-ways/
repo_url: https://github.com/aaronsb/agent-ways
repo_name: aaronsb/agent-ways
edit_uri: edit/main/docs/

docs_dir: docs
# docs/README.md is the file map for readers browsing on GitHub; the site's
# home is docs/index.md.
exclude_docs: |
  /README.md
  scripts/
  __pycache__/
  *.py
  adr.yaml

theme:
  name: material
  logo: images/agent-ways-mark.svg
  favicon: images/agent-ways-mark.svg
  # Inter from Google Fonts; code uses self-hosted Monoid (docs/stylesheets/extra.css).
  font:
    text: Inter
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.sections
    - navigation.indexes
    - navigation.prune
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.footnote.tooltips
    - content.action.view

extra_css:
  - stylesheets/extra.css

hooks:
  - scripts/docs-site/links.py

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/docs-site/gen_nav.py
        - scripts/docs-site/gen_ways.py
  - literate-nav:
      nav_file: SUMMARY.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

validation:
  links:
    # scripts/docs-site/links.py rewrites links into the rest of the repo to
    # GitHub URLs; what remains unresolved is a link to a missing file.
    not_found: info
    unrecognized_links: info
