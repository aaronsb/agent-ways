name: Live fixture (release flavor)

# ADR-186 item 2: the release flavor runs the documented one-liner, which
# clones main and downloads the latest release assets, with Claude Code at its
# latest version. It runs when a ways release finishes building and on
# dispatch (ADR-508), never on a pull request, so drift on either side shows up
# here and not as a red check on someone's PR.
# The branch flavor, the PR gate, lives in portability.yml.

on:
  # A ways-v* tag push builds and publishes the release; test it once its
  # assets are up. Branch pushes to main also complete this workflow and are
  # skipped by the job condition.
  workflow_run:
    workflows: ['Build ways CLI']
    types: [completed]
  workflow_dispatch:
    inputs:
      claude_version:
        description: Claude Code version to bake into the image
        default: latest
      claude_installer:
        description: native or npm
        default: native
      tier2_model:
        description: model for tier 2 scenarios (empty for the runner's default)
        default: ''
      tier2_scenarios:
        description: space-separated tier 2 scenario names (empty runs all)
        default: ''

jobs:
  tier1-release:
    name: tier 1, release flavor
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'ways-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Run tier 1 against the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          FLAVOR: release
          CLAUDE_VERSION: ${{ inputs.claude_version || 'latest' }}
          CLAUDE_INSTALLER: ${{ inputs.claude_installer || 'native' }}
        run: make test-live TIER=1

  # ADR-186 items 3 and 4, amended by ADR-508: tier 2 spends tokens, so it runs
  # only here, after a ways release and on dispatch, never on a pull request. It fails, rather than
  # passing, when the secret is missing, so absence of a key never reads green.
  tier2-release:
    name: tier 2, release flavor
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'ways-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Run tier 2 against the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FLAVOR: release
          CLAUDE_VERSION: ${{ inputs.claude_version || 'latest' }}
          CLAUDE_INSTALLER: ${{ inputs.claude_installer || 'native' }}
          TIER2_MODEL: ${{ inputs.tier2_model }}
          TIER2_SCENARIOS: ${{ inputs.tier2_scenarios }}
          TIER2_OUT: ${{ runner.temp }}/tier2-out
        run: make test-live TIER=2

      - name: Keep the transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier2-transcripts
          path: ${{ runner.temp }}/tier2-out
          if-no-files-found: ignore
