name: Build ways-agent

on:
  push:
    branches: [main]
    tags: ['ways-agent-v*']
    paths:
      - 'tools/ways-agent/**'
      - 'tools/agent-fmt/**'
      - 'tools/agent-identity/**'
      - 'tools/agent-settings/**'
      - 'tools/agent-theme/**'
      - 'tools/claude-sessions/**'
      - 'tools/sensor-trait/**'
      - 'tools/ways-agent-core/**'
      - 'tools/ways-core/**'
      - 'tools/Cargo.toml'
      - 'tools/Cargo.lock'
      - '.github/workflows/build-ways-agent.yml'
      - '.github/workflows/reusable-build.yml'
  pull_request:
    paths:
      - 'tools/ways-agent/**'
      - 'tools/agent-fmt/**'
      - 'tools/agent-identity/**'
      - 'tools/agent-settings/**'
      - 'tools/agent-theme/**'
      - 'tools/claude-sessions/**'
      - 'tools/sensor-trait/**'
      - 'tools/ways-agent-core/**'
      - 'tools/ways-core/**'
      - 'tools/Cargo.toml'
      - 'tools/Cargo.lock'
      - '.github/workflows/build-ways-agent.yml'
      - '.github/workflows/reusable-build.yml'
  workflow_dispatch:

jobs:
  build:
    # A release bump PR changes only a version line and the lockfile; the tag
    # push that follows it builds and tests every platform.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/')
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: write  # the release job publishes; the others drop to read
    with:
      component: ways-agent
      test-os: '["ubuntu-latest", "macos-latest"]'
      test: |
        cargo test --manifest-path tools/Cargo.toml -p ways-agent -p ways-agent-core
      release-notes: |-
        Pre-built ways-agent binaries for 4 platforms.

        Build from source: `make ways-agent`
