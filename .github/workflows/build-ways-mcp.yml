name: Build ways-mcp

on:
  push:
    branches: [main]
    tags: ['ways-mcp-v*']
    paths:
      - 'tools/ways-mcp/**'
      - 'tools/attend-session/**'
      - 'tools/Cargo.toml'
      - 'tools/Cargo.lock'
      - '.github/workflows/build-ways-mcp.yml'
      - '.github/workflows/reusable-build.yml'
  pull_request:
    paths:
      - 'tools/ways-mcp/**'
      - 'tools/attend-session/**'
      - 'tools/Cargo.toml'
      - 'tools/Cargo.lock'
      - '.github/workflows/build-ways-mcp.yml'
      - '.github/workflows/reusable-build.yml'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: write  # the release job publishes; the others drop to read
    with:
      component: ways-mcp
      test-os: '["ubuntu-latest", "macos-latest"]'
      # attend-session's ancestry walk is how the server finds its session;
      # its ps invocation has to work on BSD ps as well as GNU.
      test: |
        cargo test --manifest-path tools/Cargo.toml -p ways-mcp -p attend-session
      release-notes: |-
        Pre-built ways-mcp binaries for 4 platforms.

        Build from source: `make ways-mcp`
