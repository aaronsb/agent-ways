name: Build ways-mcp

on:
  push:
    branches: [main]
    tags: ['ways-mcp-v*']
    paths:
      - 'tools/ways-mcp/**'
      - 'tools/agent-settings/**'
      - 'tools/attend-presence/**'
      - 'tools/claude-sessions/**'
      - 'tools/Cargo.toml'
      - 'tools/Cargo.lock'
      - '.github/workflows/build-ways-mcp.yml'
      - '.github/workflows/reusable-build.yml'
  pull_request:
    paths:
      - 'tools/ways-mcp/**'
      - 'tools/agent-settings/**'
      - 'tools/attend-presence/**'
      - 'tools/claude-sessions/**'
      - 'tools/Cargo.toml'
      - 'tools/Cargo.lock'
      - '.github/workflows/build-ways-mcp.yml'
      - '.github/workflows/reusable-build.yml'
  workflow_dispatch:

jobs:
  build:
    # A release bump PR changes only a version line and the lockfile; the tag
    # push that follows it builds and tests every platform.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/')
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: write  # the release job publishes; the others drop to read
    with:
      component: ways-mcp
      test-os: '["ubuntu-latest", "macos-latest"]'
      # attend-presence's ancestry walk is how the server finds its session;
      # its ps fallback (no /proc) has to work on BSD ps as well as GNU.
      test: |
        cargo test --manifest-path tools/Cargo.toml -p ways-mcp -p attend-presence
      release-notes: |-
        Pre-built ways-mcp binaries for 4 platforms.

        Build from source: `make ways-mcp`
