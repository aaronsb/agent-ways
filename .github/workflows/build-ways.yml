name: Build ways CLI

on:
  push:
    branches: [main]
    tags: ['ways-v*']
    paths:
      - 'tools/ways-cli/**'
      - 'tools/ways-core/**'
      - 'tools/agent-fmt/**'
      - 'tools/Cargo.toml'
      - 'tools/Cargo.lock'
      - '.github/workflows/build-ways.yml'
      - '.github/workflows/reusable-build.yml'
  pull_request:
    paths:
      - 'tools/ways-cli/**'
      - 'tools/ways-core/**'
      - 'tools/agent-fmt/**'
      - 'tools/Cargo.toml'
      - 'tools/Cargo.lock'
      - '.github/workflows/build-ways.yml'
      - '.github/workflows/reusable-build.yml'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: write  # the release job publishes; the others drop to read
    with:
      component: ways
      test: |
        cargo test --manifest-path tools/Cargo.toml -p ways
        cargo test --manifest-path tools/Cargo.toml -p ways --test session_sim -- --test-threads=1
        # Lint way frontmatter: the ways binary against the repo corpus. `ways lint`
        # resolves its schema from hooks/ways/frontmatter-schema.yaml, so this needs
        # no ~/.claude projection and no make target. A frontmatter error that would
        # silently drop a way from matching fails the build here.
        cargo build --manifest-path tools/Cargo.toml -p ways
        tools/target/debug/ways lint --check hooks/ways
      release-notes: |-
        Pre-built ways CLI binaries for 4 platforms.

        Install: `bash tools/scripts/download-prebuilt.sh ways`
        Or build from source: `make ways`
