name: Build a component

# The jobs every build-<component>.yml runs, called with workflow_call: build
# the component for each platform, run its tests, gather the binaries with a
# checksums.txt, and on a <component>-v* tag publish the GitHub Release.
# The callers own their triggers, so each component builds on its own paths
# and releases on its own tags.
#
# The platforms split in two. The gating platforms, and the tests on Linux
# runners, must pass before the release is published. The best-effort
# platforms (darwin-arm64 by default) and the tests on macOS runners do not
# gate it: a best-effort binary attaches to the published release when its
# build completes, and a failed or never-scheduled leg leaves the release as
# it is. The macOS runner queue can hold a job for hours.
#
#   plan -> build ------------+-> collect -> release -+-> attach-best-effort
#        -> test -------------'                       |
#        -> build-best-effort ------------------------'
#        -> test-best-effort (nothing waits on it)

on:
  workflow_call:
    inputs:
      component:
        description: Binary name, used for assets (<component>-<platform>) and tags (<component>-v*)
        type: string
        required: true
      kind:
        description: cargo (a package of tools/Cargo.toml named <component>) or cmake (tools/way-embed)
        type: string
        default: cargo
      matrix:
        description: Build matrix include list as JSON; each entry has os and platform, a cargo entry a target, a cmake entry optional cmake_extra and cross
        type: string
        default: >-
          [
            {"target": "x86_64-unknown-linux-gnu", "platform": "linux-x86_64", "os": "ubuntu-latest"},
            {"target": "aarch64-unknown-linux-gnu", "platform": "linux-aarch64", "os": "ubuntu-latest"},
            {"target": "x86_64-apple-darwin", "platform": "darwin-x86_64", "os": "macos-latest"},
            {"target": "aarch64-apple-darwin", "platform": "darwin-arm64", "os": "macos-latest"}
          ]
      test:
        description: Shell script for the test job; empty skips the job
        type: string
        default: ''
      test-os:
        description: Runners for the test job, as a JSON list
        type: string
        default: '["ubuntu-latest"]'
      best-effort-platforms:
        description: Platforms, as a JSON list, whose builds do not gate the release; each attaches to it when its build completes
        type: string
        default: '["darwin-arm64"]'
      release-notes:
        description: Body of the GitHub Release
        type: string
        required: true

jobs:
  # Split the build matrix and the test runners into the gating set and the
  # best-effort set, and name each set's artifacts as a download pattern.
  plan:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      gating: ${{ steps.split.outputs.gating }}
      gating_pattern: ${{ steps.split.outputs.gating_pattern }}
      best_effort: ${{ steps.split.outputs.best_effort }}
      best_effort_pattern: ${{ steps.split.outputs.best_effort_pattern }}
      test_gating: ${{ steps.split.outputs.test_gating }}
      test_best_effort: ${{ steps.split.outputs.test_best_effort }}
    steps:
      - id: split
        env:
          COMPONENT: ${{ inputs.component }}
          MATRIX: ${{ inputs.matrix }}
          BEST_EFFORT: ${{ inputs.best-effort-platforms }}
          TEST_OS: ${{ inputs.test-os }}
        run: |
          # A brace pattern needs two names or more: download-artifact reads
          # `{a}` as a literal name.
          pattern='map(env.COMPONENT + "-" + .platform) | if length == 1 then .[0] else "{" + join(",") + "}" end'
          gating=$(jq -c --argjson be "$BEST_EFFORT" '[.[] | select(.platform | IN($be[]) | not)]' <<<"$MATRIX")
          best_effort=$(jq -c --argjson be "$BEST_EFFORT" '[.[] | select(.platform | IN($be[]))]' <<<"$MATRIX")
          {
            echo "gating=$gating"
            echo "gating_pattern=$(jq -r "$pattern" <<<"$gating")"
            echo "best_effort=$best_effort"
            echo "best_effort_pattern=$(jq -r "$pattern" <<<"$best_effort")"
            echo "test_gating=$(jq -c '[.[] | select(startswith("macos") | not)]' <<<"$TEST_OS")"
            echo "test_best_effort=$(jq -c '[.[] | select(startswith("macos"))]' <<<"$TEST_OS")"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.gating != '[]'
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.gating) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env: &build-env
      BIN: dist/${{ inputs.component }}-${{ matrix.platform }}
    steps: &build-steps
      - uses: actions/checkout@v5
        with:
          submodules: ${{ inputs.kind == 'cmake' && 'recursive' || 'false' }}

      - name: Install Rust toolchain
        if: inputs.kind == 'cargo'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild (Linux cross-compile)
        if: inputs.kind == 'cargo' && runner.os == 'Linux' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          pip3 install --retries 10 --timeout 60 ziglang
          cargo install cargo-zigbuild

      - name: Build (native)
        if: inputs.kind == 'cargo' && !(runner.os == 'Linux' && matrix.target == 'aarch64-unknown-linux-gnu')
        run: cargo build --release --manifest-path tools/Cargo.toml -p ${{ inputs.component }} --target ${{ matrix.target }}

      - name: Build (zigbuild cross-compile)
        if: inputs.kind == 'cargo' && runner.os == 'Linux' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo zigbuild --release --manifest-path tools/Cargo.toml -p ${{ inputs.component }} --target ${{ matrix.target }}

      - name: Package binary
        if: inputs.kind == 'cargo'
        run: |
          mkdir -p dist
          cp tools/target/${{ matrix.target }}/release/${{ inputs.component }} "$BIN"

      - name: Install dependencies
        if: inputs.kind == 'cmake'
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y cmake g++
          fi
          # macOS runners have cmake and clang pre-installed

      - name: Build way-embed
        if: inputs.kind == 'cmake'
        working-directory: tools/way-embed
        run: |
          mkdir -p build ../../dist
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_extra }} ..
          cmake --build . --target way-embed -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)"
          cd ..
          cp build/way-embed "../../$BIN"

      # A native build runs here. A cross-compiled one (marked cross, a Linux
      # aarch64 zigbuild, or an x86_64 Mac build on an Apple Silicon runner)
      # can only be checked with `file`.
      - name: Smoke test
        if: "!(matrix.cross || (matrix.target == 'aarch64-unknown-linux-gnu' && runner.os == 'Linux') || (matrix.target == 'x86_64-apple-darwin' && runner.arch == 'ARM64'))"
        run: '"$BIN" --version'

      # The x86 runner has AVX-512, so the smoke test passes even when the
      # binary would die on an AVX2-only CPU. Check the instructions instead.
      - name: No AVX-512 in the portable x86 build
        if: inputs.kind == 'cmake' && matrix.platform == 'linux-x86_64'
        run: |
          n=$(objdump -d --no-show-raw-insn "$BIN" | grep -c zmm || true)
          echo "zmm instructions: $n"
          test "$n" -eq 0

      - name: Verify binary (cross-compiled — can't execute on this runner)
        if: matrix.cross || (matrix.target == 'aarch64-unknown-linux-gnu' && runner.os == 'Linux') || (matrix.target == 'x86_64-apple-darwin' && runner.arch == 'ARM64')
        run: |
          file "$BIN"
          ls -lh "$BIN"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.component }}-${{ matrix.platform }}
          path: ${{ env.BIN }}

  # The build steps again, through the YAML anchors. A failed leg shows on the
  # run; only attach-best-effort waits on this job.
  build-best-effort:
    needs: plan
    if: needs.plan.outputs.best_effort != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.best_effort) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env: *build-env
    steps: *build-steps

  test:
    needs: plan
    if: inputs.test != '' && needs.plan.outputs.test_gating != '[]'
    strategy:
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.test_gating) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps: &test-steps
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: ${{ inputs.test }}

  # The tests on macOS runners. No job waits on this one, so a failure shows
  # on the run and does not hold the release.
  test-best-effort:
    needs: plan
    if: inputs.test != '' && needs.plan.outputs.test_best_effort != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.test_best_effort) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps: *test-steps

  # Runs when the test job is skipped too (a component without tests, or
  # with macOS test runners only). A cancelled build leg is neither
  # cancelled() nor failure() at the workflow level, so the gate reads each
  # result: every gating platform must have built. The leading !cancelled()
  # replaces the implicit success(), which is false when test was skipped
  # and would skip collect for a component with no tests.
  collect:
    needs: [plan, build, test]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The gating platforms' binaries only. A best-effort binary that built
      # early attaches later, and a rerun of all jobs would otherwise merge an
      # earlier attempt's -all-platforms artifact over this attempt's builds.
      - uses: actions/download-artifact@v5
        with:
          path: binaries
          pattern: ${{ needs.plan.outputs.gating_pattern }}
          merge-multiple: true

      - name: Generate checksums
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          cd binaries
          sha256sum "$COMPONENT"-* > checksums.txt
          cat checksums.txt
          ls -lh

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.component }}-all-platforms
          path: binaries/

  release:
    needs: collect
    if: ${{ !cancelled() && needs.collect.result == 'success' && startsWith(github.ref, format('refs/tags/{0}-v', inputs.component)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - &checkout-merge-script
        uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/ci-merge-checksums.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.component }}-all-platforms
          path: binaries

      # A release that exists already can hold a best-effort binary and its
      # checksum line. The upload replaces checksums.txt, so the script keeps
      # the old lines for the files the upload does not replace.
      - name: Merge with the release's checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-merge-checksums.sh "${GITHUB_REF#refs/tags/}" binaries

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
          NOTES: ${{ inputs.release-notes }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # A rerun after a failed leg finds the release already made: replace
          # its assets and keep its notes.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber binaries/*
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$COMPONENT ${TAG#"$COMPONENT"-}" \
            --notes "$NOTES" \
            binaries/*

  # A best-effort binary joins the release this run published: upload it and
  # add its line to the release's checksums.txt. A run of the workflow from
  # before this job existed never attaches anything.
  attach-best-effort:
    needs: [plan, release, build-best-effort]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.build-best-effort.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - *checkout-merge-script

      - uses: actions/download-artifact@v5
        with:
          path: binaries
          pattern: ${{ needs.plan.outputs.best_effort_pattern }}
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-merge-checksums.sh --upload "${GITHUB_REF#refs/tags/}" binaries
