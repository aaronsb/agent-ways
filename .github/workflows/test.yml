name: Test

# One job that runs every crate's tests and the hook script tests. The per-binary build-*.yml workflows
# test only their own crate, so a change confined to a library crate
# (attend-groups, agent-fmt, sensor-peers) ran no tests at all.

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'hooks/**'
      - 'tests/**'
      - 'Makefile'
      - 'scripts/install.sh'
      - 'scripts/workflow-paths.sh'
      - 'scripts/release.sh'
      - 'scripts/check-plugins.sh'
      - 'plugins/**'
      - '.github/workflows/build-*.yml'
      - '.github/workflows/reusable-build.yml'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'hooks/**'
      - 'tests/**'
      - 'Makefile'
      - 'scripts/install.sh'
      - 'scripts/workflow-paths.sh'
      - 'scripts/release.sh'
      - 'scripts/check-plugins.sh'
      - 'plugins/**'
      - '.github/workflows/build-*.yml'
      - '.github/workflows/reusable-build.yml'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # tui-harness drives a real tmux session. The runner image ships tmux
      # today, but its package list is not a contract, so install it. With
      # TUI_HARNESS_REQUIRE_TMUX set, the tmux test fails rather than skips.
      - name: install tmux
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tmux
          echo "TUI_HARNESS_REQUIRE_TMUX=1" >> "$GITHUB_ENV"
      # Tests in other crates (ways-cli's tui_smoke) launch through the
      # tui-harness binary; build it explicitly rather than rely on the
      # workspace build order.
      - name: build tui-harness
        run: cargo build --manifest-path tools/Cargo.toml -p tui-harness
      - name: test
        run: cargo test --manifest-path tools/Cargo.toml --workspace
      # attend compiles with any subset of its sensors. The default build
      # covers all three; these two keep the cut-down builds compiling and
      # their tests passing.
      - name: attend without sensors
        run: cargo test --manifest-path tools/Cargo.toml -p attend --no-default-features
      - name: attend with only the keepwarm sensor
        run: cargo test --manifest-path tools/Cargo.toml -p attend --no-default-features --features sensor-keepwarm
      - name: hook tests
        run: make test-hooks

  plugins:
    # The Claude Code mods in plugins/ (ADR-406): version lockstep with
    # attend, `claude plugin validate`, and `claude plugin test`. The build is
    # pinned to the one the mod's early-access API was written against; move
    # it when the mod is checked against a newer Claude Code. Type checking
    # needs the declarations Claude Code lays beside a mod it loads in a
    # session, which a runner has none of, so the script reports it skipped.
    name: plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: validate and test
        run: make test-plugins
