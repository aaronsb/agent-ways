name: Build attend

on:
  push:
    branches: [main]
    tags: ['attend-v*']
    paths:
      - 'tools/attend/**'
      - 'tools/agent-fmt/**'
      - 'tools/sensor-*/**'
      - 'tools/Cargo.toml'
      - 'tools/Cargo.lock'
      - '.github/workflows/build-attend.yml'
      - '.github/workflows/reusable-build.yml'
  pull_request:
    paths:
      - 'tools/attend/**'
      - 'tools/agent-fmt/**'
      - 'tools/sensor-*/**'
      - 'tools/Cargo.toml'
      - 'tools/Cargo.lock'
      - '.github/workflows/build-attend.yml'
      - '.github/workflows/reusable-build.yml'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: write  # the release job publishes; the others drop to read
    with:
      component: attend
      test: |
        cargo test --manifest-path tools/Cargo.toml -p attend
      release-notes: |-
        Pre-built attend binaries for 4 platforms.

        Build from source: `make attend`
