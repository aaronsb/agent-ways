name: Build attend

on:
  push:
    branches: [main]
    tags: ['attend-v*']
    paths:
      - 'tools/attend/**'
      - 'tools/agent-fmt/**'
      - 'tools/agent-identity/**'
      - 'tools/agent-theme/**'
      - 'tools/attend-groups/**'
      - 'tools/attend-heartbeat/**'
      - 'tools/attend-identity-view/**'
      - 'tools/attend-instances/**'
      - 'tools/attend-session/**'
      - 'tools/attend-state/**'
      - 'tools/claude-sessions/**'
      - 'tools/sensor-context/**'
      - 'tools/sensor-disclosure/**'
      - 'tools/sensor-git/**'
      - 'tools/sensor-keepwarm/**'
      - 'tools/sensor-peers/**'
      - 'tools/sensor-processes/**'
      - 'tools/sensor-trait/**'
      - 'tools/ways-core/**'
      - 'tools/Cargo.toml'
      - 'tools/Cargo.lock'
      - '.github/workflows/build-attend.yml'
      - '.github/workflows/reusable-build.yml'
  pull_request:
    paths:
      - 'tools/attend/**'
      - 'tools/agent-fmt/**'
      - 'tools/agent-identity/**'
      - 'tools/agent-theme/**'
      - 'tools/attend-groups/**'
      - 'tools/attend-heartbeat/**'
      - 'tools/attend-identity-view/**'
      - 'tools/attend-instances/**'
      - 'tools/attend-session/**'
      - 'tools/attend-state/**'
      - 'tools/claude-sessions/**'
      - 'tools/sensor-context/**'
      - 'tools/sensor-disclosure/**'
      - 'tools/sensor-git/**'
      - 'tools/sensor-keepwarm/**'
      - 'tools/sensor-peers/**'
      - 'tools/sensor-processes/**'
      - 'tools/sensor-trait/**'
      - 'tools/ways-core/**'
      - 'tools/Cargo.toml'
      - 'tools/Cargo.lock'
      - '.github/workflows/build-attend.yml'
      - '.github/workflows/reusable-build.yml'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: write  # the release job publishes; the others drop to read
    with:
      component: attend
      test: |
        cargo test --manifest-path tools/Cargo.toml -p attend
      release-notes: |-
        Pre-built attend binaries for 4 platforms.

        Build from source: `make attend`
