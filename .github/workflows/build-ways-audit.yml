name: Build ways-audit

on:
  push:
    branches: [main]
    tags: ['ways-audit-v*']
    paths:
      - 'tools/ways-audit/**'
      - 'tools/agent-theme/**'
      - 'tools/claude-sessions/**'
      - 'tools/sensor-trait/**'
      - 'tools/ways-core/**'
      - 'tools/Cargo.toml'
      - 'tools/Cargo.lock'
      - '.github/workflows/build-ways-audit.yml'
      - '.github/workflows/reusable-build.yml'
  pull_request:
    paths:
      - 'tools/ways-audit/**'
      - 'tools/agent-theme/**'
      - 'tools/claude-sessions/**'
      - 'tools/sensor-trait/**'
      - 'tools/ways-core/**'
      - 'tools/Cargo.toml'
      - 'tools/Cargo.lock'
      - '.github/workflows/build-ways-audit.yml'
      - '.github/workflows/reusable-build.yml'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: write  # the release job publishes; the others drop to read
    with:
      component: ways-audit
      test: |
        cargo test --manifest-path tools/Cargo.toml -p ways-audit -p ways-core
      release-notes: |-
        Pre-built ways-audit binaries for 4 platforms.

        Build from source: `make ways-audit`
