name: Build way-embed

on:
  push:
    branches: [main]
    tags: ['way-embed-v*']
    paths:
      - 'tools/way-embed/**'
      - '.github/workflows/build-way-embed.yml'
      - '.github/workflows/reusable-build.yml'
  pull_request:
    paths:
      - 'tools/way-embed/**'
      - '.github/workflows/build-way-embed.yml'
      - '.github/workflows/reusable-build.yml'
  workflow_dispatch:

jobs:
  build:
    # A release bump PR changes only a version line and the lockfile; the tag
    # push that follows it builds and tests every platform.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/')
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: write  # the release job publishes; the others drop to read
    with:
      component: way-embed
      kind: cmake
      # GGML_NATIVE=OFF: llama.cpp otherwise compiles for the runner's own
      # CPU. GitHub's x86 runners have AVX-512, and a native build died
      # with SIGILL on AVX2-only CPUs (Alder Lake and later Intel client
      # chips). Off, x86 targets the AVX2/FMA/F16C baseline and aarch64
      # plain ARMv8. The Apple Silicon build stays native; every arm64
      # Mac shares its baseline.
      matrix: >-
        [
          {"os": "ubuntu-latest", "platform": "linux-x86_64", "cmake_extra": "-DGGML_NATIVE=OFF"},
          {"os": "ubuntu-24.04-arm", "platform": "linux-aarch64", "cmake_extra": "-DGGML_NATIVE=OFF"},
          {"os": "macos-latest", "platform": "darwin-x86_64", "cmake_extra": "-DCMAKE_OSX_ARCHITECTURES=x86_64 -DGGML_NATIVE=OFF", "cross": true},
          {"os": "macos-latest", "platform": "darwin-arm64"}
        ]
      release-notes: |-
        Pre-built way-embed (semantic matcher) binaries for 4 platforms.

        Downloaded automatically by `make setup` / the installer, so semantic
        matching works with no C++ toolchain. To build from source instead,
        install a C++ toolchain (cmake + compiler), then `make setup`.
