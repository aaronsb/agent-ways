name: Build way-embed

on:
  push:
    branches: [main]
    tags: ['way-embed-v*']
    paths:
      - 'tools/way-embed/**'
      - '.github/workflows/build-way-embed.yml'
  pull_request:
    paths:
      - 'tools/way-embed/**'
      - '.github/workflows/build-way-embed.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          # GGML_NATIVE=OFF: llama.cpp otherwise compiles for the runner's own
          # CPU. GitHub's x86 runners have AVX-512, and a native build died
          # with SIGILL on AVX2-only CPUs (Alder Lake and later Intel client
          # chips). Off, x86 targets the AVX2/FMA/F16C baseline and aarch64
          # plain ARMv8. The Apple Silicon build stays native; every arm64
          # Mac shares its baseline.
          - os: ubuntu-latest
            platform: linux-x86_64
            cmake_extra: -DGGML_NATIVE=OFF
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            cmake_extra: -DGGML_NATIVE=OFF
          - os: macos-latest
            platform: darwin-x86_64
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES=x86_64 -DGGML_NATIVE=OFF
            cross: true
          - os: macos-latest
            platform: darwin-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y cmake g++
          fi
          # macOS runners have cmake and clang pre-installed

      - name: Build way-embed
        working-directory: tools/way-embed
        run: |
          mkdir -p build ../../bin
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_extra }} ..
          cmake --build . --target way-embed -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          cd ..
          cp build/way-embed ../../bin/way-embed-${{ matrix.platform }}

      - name: Smoke test
        if: ${{ !matrix.cross }}
        run: |
          bin/way-embed-${{ matrix.platform }} --version

      # The runner has AVX-512, so the smoke test above passes even when the
      # binary would die on an AVX2-only CPU. Check the instructions instead.
      - name: No AVX-512 in the portable x86 build
        if: ${{ matrix.platform == 'linux-x86_64' }}
        run: |
          n=$(objdump -d --no-show-raw-insn bin/way-embed-linux-x86_64 | grep -c zmm || true)
          echo "zmm instructions: $n"
          test "$n" -eq 0

      - name: Verify binary exists (cross-compiled)
        if: ${{ matrix.cross }}
        run: |
          file bin/way-embed-${{ matrix.platform }}
          ls -lh bin/way-embed-${{ matrix.platform }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: way-embed-${{ matrix.platform }}
          path: bin/way-embed-${{ matrix.platform }}

  # Collect all platform binaries into one artifact
  collect:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: binaries
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd binaries
          sha256sum way-embed-* > checksums.txt
          cat checksums.txt
          ls -lh

      - uses: actions/upload-artifact@v5
        with:
          name: way-embed-all-platforms
          path: binaries/

  release:
    needs: collect
    if: startsWith(github.ref, 'refs/tags/way-embed-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: way-embed-all-platforms
          path: binaries

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "way-embed ${TAG#way-embed-}" \
            --notes "Pre-built way-embed (semantic matcher) binaries for 4 platforms.

          Downloaded automatically by \`make setup\` / the installer, so semantic
          matching works with no C++ toolchain. To build from source instead,
          install a C++ toolchain (cmake + compiler), then \`make setup\`." \
            binaries/*
