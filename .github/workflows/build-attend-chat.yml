name: Build attend-chat

on:
  push:
    branches: [main]
    tags: ['attend-chat-v*']
    paths:
      - 'tools/attend-chat/**'
      - 'tools/agent-fmt/**'
      - 'tools/agent-identity/**'
      - 'tools/agent-settings/**'
      - 'tools/agent-theme/**'
      - 'tools/agent-tui/**'
      - 'tools/attend-config/**'
      - 'tools/attend-groups/**'
      - 'tools/attend-instances/**'
      - 'tools/attend-presence/**'
      - 'tools/attend-state/**'
      - 'tools/claude-sessions/**'
      - 'tools/Cargo.toml'
      - 'tools/Cargo.lock'
      - '.github/workflows/build-attend-chat.yml'
      - '.github/workflows/reusable-build.yml'
  pull_request:
    paths:
      - 'tools/attend-chat/**'
      - 'tools/agent-fmt/**'
      - 'tools/agent-identity/**'
      - 'tools/agent-settings/**'
      - 'tools/agent-theme/**'
      - 'tools/agent-tui/**'
      - 'tools/attend-config/**'
      - 'tools/attend-groups/**'
      - 'tools/attend-instances/**'
      - 'tools/attend-presence/**'
      - 'tools/attend-state/**'
      - 'tools/claude-sessions/**'
      - 'tools/Cargo.toml'
      - 'tools/Cargo.lock'
      - '.github/workflows/build-attend-chat.yml'
      - '.github/workflows/reusable-build.yml'
  workflow_dispatch:

jobs:
  build:
    # A release bump PR changes only a version line and the lockfile; the tag
    # push that follows it builds and tests every platform.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/')
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: write  # the release job publishes; the others drop to read
    with:
      component: attend-chat
      test: |
        cargo test --manifest-path tools/Cargo.toml -p attend-chat
      release-notes: |-
        Pre-built attend-chat binaries for 4 platforms.

        Build from source: `make attend-chat`
