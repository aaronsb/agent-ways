name: REUSE

# Every file carries copyright and license information: an SPDX header in
# source files, REUSE.toml for the rest. A new file without either fails here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  reuse:
    name: reuse lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run reuse==6.2.0 lint
