# Shipped with attend (ADR-403). A file of the same name under
# $XDG_CONFIG_HOME/attend/sensors/ or a project's .claude/attend/sensors/
# overrides any field here.
#
# peers reports Claude Code sessions starting and leaving, and one in the
# same project nearing compaction. It does not report a session turning
# between working and waiting, which happens every turn.
# Presence is no one's words, so it rides the event lane. It reads no
# messages: the attend mod's drain carries them.
spec: 1
name: peers
description: discovers Claude Code sessions and reports their presence
kind: crate
crate: peers
interval: 30
min_interval: 10
threshold: 2.0
decay_threshold: 5
requires: ["Read"]
