# Shipped with attend (ADR-403). A file of the same name under
# $XDG_CONFIG_HOME/attend/sensors/ or a project's .claude/attend/sensors/
# overrides any field here.
#
# keepwarm's timed wake has no author. attend runs this compiled sensor on
# the message lane whatever its files say, so no refractory holds the wake.
spec: 1
name: keepwarm
description: keeps the prompt cache warm with one wake per idle stretch
kind: crate
crate: keepwarm
interval: 60
min_interval: 60
threshold: 3.0
decay_threshold: 3
requires: ["Bash(ways:*)"]
lane: message
