<text x="18" y="354" font-size="12" fill="#555">Tokens through the session. After n fires in the thread, the next refire waits H x g^(n-1). The fire granted after compaction counts toward n.</text>
<text x="18" y="374" font-size="12" fill="#555">Dashed line: compaction, which removes the way's text and clears the fire clock but, under the chosen rule, keeps n.</text>
